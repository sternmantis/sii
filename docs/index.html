<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Slip It In</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #1e1e2e; color: #eee; }
    .lobby { max-width: 480px; margin: 60px auto; text-align: center; }
    .lobby h2 { margin-bottom: 20px; }
    .lobby button { background: #4d4d6c; color: #eee; border: none; border-radius: 6px;
      padding: 10px 16px; cursor: pointer; margin: 6px; }
    .lobby button:disabled { opacity: 0.4; cursor: not-allowed; }
    .join-row { margin-top: 16px; display: flex; gap: 8px; justify-content: center; }
    .join-row input { padding: 8px; border-radius: 6px; border: none; }
    .host-id { display: inline-block; background: #333; padding: 8px 12px; border-radius: 6px;
      margin: 10px 0; word-break: break-all; }
    .lobby ul { list-style: none; padding: 0; }

    .game-layout {
      display: grid;
      grid-template-columns: 200px 1fr;
      grid-template-rows: 1fr 100px;
      height: 100vh;
    }
    .hand-panel { grid-row: 1 / 2; grid-column: 1 / 2; background: #2a2a3d; padding: 12px; overflow-y: auto; }
    .board-panel { grid-row: 1 / 2; grid-column: 2 / 3; padding: 12px; overflow-y: auto; }
    .player-list { grid-row: 2 / 3; grid-column: 1 / 3; background: #2a2a3d;
      display: flex; align-items: center; gap: 10px; padding: 0 12px; flex-wrap: wrap; }
    .card { background: #3d3d5c; border-radius: 6px; padding: 8px; margin: 6px 0;
      cursor: pointer; transition: transform 0.1s; }
    .card:hover { transform: scale(1.03); background: #4d4d6c; }
    .board-cards { display: flex; flex-wrap: wrap; gap: 8px; }
    .played-card { background: #333; border-radius: 6px; padding: 8px 12px; }
    .player-tag { font-size: 0.75em; color: #9c9cff; margin-right: 6px; }
    .player-chip { background: #444; border-radius: 12px; padding: 4px 10px; font-size: 0.85em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- PeerJS: used only for signaling (initial handshake) via its free
       public broker. All game data flows peer-to-peer afterward. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
