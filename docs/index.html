<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Slip It In!</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: sans-serif;
      background: #1e1e2e;
      color: #eee;
    }

    .lobby {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 16px;
      text-align: center;
    }
    .lobby h2 { margin-bottom: 20px; }
    .lobby button {
      background: #4d4d6c; color: #eee; border: none; border-radius: 6px;
      padding: 12px 18px; font-size: 1em; cursor: pointer; margin: 6px;
      min-height: 44px;
    }
    .lobby button:disabled { opacity: 0.4; cursor: not-allowed; }
    .join-row { margin-top: 16px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .join-row input {
      padding: 10px; border-radius: 6px; border: none;
      text-transform: uppercase; letter-spacing: 2px; width: 110px;
      text-align: center; font-size: 1.1em; min-height: 44px;
    }
    .host-id {
      display: inline-block; background: #333; padding: 10px 14px; border-radius: 6px;
      margin: 10px 0; word-break: break-all; font-size: 1.3em; letter-spacing: 2px;
    }
    .lobby ul { list-style: none; padding: 0; }
    .error-text { color: #ff8080; font-size: 0.9em; }

    /* Mobile-first: single scrolling column, no fixed viewport-height
       assumptions (avoids iOS Safari's shifting 100vh issues). */
    .game-layout {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    .hand-panel {
      flex: 1 1 auto;
      padding: 12px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      overflow-y: auto;
    }
    .player-list {
      flex: 0 0 auto;
      background: #2a2a3d;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      position: sticky;
      bottom: 0;
    }

    .card {
      background: #3d3d5c; border-radius: 8px; padding: 12px; margin: 10px 0;
    }
    .card-text { margin-bottom: 8px; font-size: 1.05em; }
    .card-actions { display: flex; gap: 8px; }
    .card-actions button {
      flex: 1; font-size: 0.9em; padding: 10px 8px; border-radius: 6px;
      border: none; cursor: pointer; color: #eee; min-height: 40px;
    }
    .complete-btn { background: #4a5a7a; }
    .slip-btn { background: #7a4a4a; }
    .card-actions button:active { filter: brightness(1.2); }

    .player-chip {
      background: #444; border-radius: 12px; padding: 5px 12px; font-size: 0.85em;
    }

    /* Slightly roomier layout on larger screens */
    @media (min-width: 700px) {
      .hand-panel { padding: 24px; }
      .card { padding: 16px; }
      .card-actions button { flex: initial; padding: 10px 20px; }
    }

    #announcements {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
      width: min(90vw, 420px);
      pointer-events: none;
    }
    .announcement-toast {
      background: #6a3d8f;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.9em;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      animation: toast-in 0.2s ease-out;
    }
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- PeerJS: used only for signaling (initial handshake) via its free
       public broker. All game data flows peer-to-peer afterward. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="bundle.js"></script>
</body>
</html>
